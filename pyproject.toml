[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yasb-ime-label"
version = "0.1.0"
description = "Independent YASB language widget with Windows IMM32 IME state and configurable label maps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
# No dependencies: YASB itself provides PyQt6, pydantic and the core modules
# this widget imports. Install it into the same environment as YASB.
dependencies = []

[tool.hatch.build.targets.wheel]
# Package roots `core` and `core/widgets` intentionally have no __init__.py so
# they merge with the ones provided by YASB (PEP 420 namespace packages).
packages = ["src/core"]
